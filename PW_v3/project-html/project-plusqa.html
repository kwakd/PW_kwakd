<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK-Portfolio-P</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preload" href="../img/testCharA.png" as="image" />
    <link rel="icon" href="../img/favicon.ico" />
  </head>
  <body>
    <!-- anti-flash: apply dark class and button label before first paint -->
    <script>
      var _dark = localStorage.getItem("kwakd-dark") === "true";
      if (_dark) document.body.classList.add("dark");
      document.addEventListener("DOMContentLoaded", function () {
        var btn = document.getElementById("dm-btn");
        if (btn) btn.textContent = _dark ? "[light-mode]" : "[dark-mode]";
      });
    </script>

    <nav>
      <div class="nav-inner">
        <span class="nav-logo">
          <img
            id="nav-logo"
            src="../img/testCharA.png"
            alt="logo"
            title="click me..."
            width="30"
            height="30"
          />
        </span>
        <a href="../index.html">about me + playground</a>
        <a href="../blog.html">blog</a>
        <a class="here" href="../project.html">projects</a>
        <button class="dm-btn" id="dm-btn">toggle dark mode</button>
      </div>
    </nav>

    <div class="page">
      <a class="back" href="../project.html">projects</a>

      <img
        class="entry-hero"
        src="../img/project/plusqa/plusqa-logo2.jpg"
        alt="plusqa"
      />

      <div class="entry-section">
        <p class="entry-meta">may 2026 ~ present <i>[PlusQA]</i></p>
        <h2 class="entry-title">Enterprise cloud storage platform (100M+ users)</h2>
        <p>
          <em>write-up coming soon.</em>
        </p>
      </div>
    </div>

    <script src="../site.js"></script>
  </body>
</html>
