<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>the meadow — david kwak</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="icon" href="../../favicon.ico?v=3" />
    <meta name="description" content="Every character people have drawn and had approved, wandering a little planet. Click one to read what its maker wrote." />
    <link rel="canonical" href="https://kwakd.netlify.app/playground/3d/meadow.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="the meadow — david kwak" />
    <meta property="og:description" content="Every character people have drawn and had approved, wandering a little planet." />
    <meta property="og:url" content="https://kwakd.netlify.app/playground/3d/meadow.html" />
    <meta property="og:image" content="https://kwakd.netlify.app/img/logo/base.png" />
    <style>
      .m-wrap { max-width: 760px; margin: 0 auto; }
      .m-stage {
        position: relative; width: 100%; aspect-ratio: 16/10;
        border-radius: 8px; overflow: hidden; background: #bfe3f2;
        touch-action: none; cursor: grab;
      }
      .m-card {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
        min-width: 240px; max-width: 86%;
        background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
        padding: 0.8em 1em; box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      }
      .m-card h2 { font-size: 15px; margin-bottom: 0.2em; }
      .m-card .m-date { font-size: 12px; color: var(--dim); }
      .m-card p { font-size: 13px; margin-top: 0.5em; line-height: 1.6; }
      .m-card button {
        position: absolute; top: 6px; right: 8px;
        background: none; border: none; color: var(--dim);
        font: inherit; font-size: 15px; cursor: pointer;
      }
      .m-note { font-size: 13px; color: var(--dim); margin-top: 0.8em; }
      .m-empty {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; text-align: center; padding: 2em;
        font-size: 14px; color: #37606f;
      }
    </style>
  </head>
  <body>
    <div class="page m-wrap">
      <a class="back" href="../../index.html">about me + playground</a>
      <h1 class="entry-title">the meadow</h1>
      <p class="m-note">
        Every character people have drawn and I have approved lives here,
        wearing the skin its maker painted. Drag to look around, shift-drag or
        right-drag to move, arrow keys to walk, scroll to zoom, and click one
        to read what they wrote.
      </p>
      <div class="m-stage" id="stage">
        <div class="m-empty" id="empty" hidden></div>
      </div>
      <p class="m-note" id="status">loading…</p>
    </div>

    <script src="../config.js"></script>
    <script type="importmap">
      { "imports": { "three": "./three.module.min.js" } }
    </script>
    <script type="module">
      import { createMeadow } from './meadow.js';

      const stage = document.getElementById('stage');
      const status = document.getElementById('status');
      const empty = document.getElementById('empty');
      let card = null;

      function showCard(d) {
        if (card) { card.remove(); card = null; }
        if (!d) return;
        const when = new Date(d.created_at).toLocaleDateString(undefined, {
          year: 'numeric', month: 'long', day: 'numeric',
        });
        card = document.createElement('div');
        card.className = 'm-card';
        card.innerHTML =
          '<button aria-label="close">&times;</button>' +
          '<h2></h2><div class="m-date"></div>' +
          (d.message ? '<p></p>' : '');
        card.querySelector('h2').textContent = d.title;
        card.querySelector('.m-date').textContent = when;
        if (d.message) card.querySelector('p').textContent = d.message;
        card.querySelector('button').addEventListener('click', () => showCard(null));
        stage.appendChild(card);
      }

      const meadow = createMeadow(stage, { onSelect: showCard });
      window.__meadow = meadow;

      // demo=N fills the meadow with unpainted eggs so the scene can be
      // judged before anything is approved
      const demo = parseInt(new URLSearchParams(location.search).get('demo') || '0', 10);

      async function fetchApproved() {
        const c = window.PlaygroundConfig;
        const url = c.SUPABASE_URL +
          '/rest/v1/characters?select=id,title,message,image_data,created_at' +
          '&status=eq.approved&order=created_at.desc&limit=50';
        const res = await fetch(url, { headers: { apikey: c.SUPABASE_ANON_KEY } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }

      try {
        let rows = await fetchApproved();
        if (!rows.length && demo) {
          rows = Array.from({ length: demo }, (_, i) => ({
            id: 'demo-' + i, title: 'demo egg ' + (i + 1),
            message: 'Placeholder, not a real submission.',
            created_at: new Date().toISOString(), image_data: null,
          }));
        }
        const n = await meadow.load(rows);
        status.textContent = n
          ? n + ' egg' + (n === 1 ? '' : 's') + ' in the meadow'
          : 'nothing approved yet';
        if (!n) {
          empty.hidden = false;
          empty.textContent =
            'Nobody is here yet. Draw a character on the playground and it will turn up once it has been approved.';
        }
      } catch (e) {
        status.textContent = 'could not load: ' + e.message;
      }
    </script>
  </body>
</html>
