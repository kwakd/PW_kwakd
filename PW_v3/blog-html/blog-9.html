<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK-Portfolio</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preload" href="../img/testCharA.png" as="image" />
  </head>
  <body>
    <!-- anti-flash: apply dark class and button label before first paint -->
    <script>
      var _dark = localStorage.getItem("kwakd-dark") === "true";
      if (_dark) document.body.classList.add("dark");
      document.addEventListener("DOMContentLoaded", function () {
        var btn = document.getElementById("dm-btn");
        if (btn) btn.textContent = _dark ? "[light-mode]" : "[dark-mode]";
      });
    </script>

    <nav>
      <div class="nav-inner">
        <span class="nav-logo">
          <img
            id="nav-logo"
            src="../img/testCharA.png"
            alt="logo"
            title="click me..."
            width="30"
            height="30"
          />
        </span>
        <a href="../index.html">about me + playground</a>
        <a class="here" href="../blog.html">blog</a>
        <a href="../project.html">projects</a>
        <button class="dm-btn" id="dm-btn">toggle dark mode</button>
      </div>
    </nav>

    <div class="page">
      <a class="back" href="../blog.html">blog</a>

      <img
        class="entry-hero"
        src="../img//blog/b9/9_sc.jpg"
        alt="entry #9 screenshot"
      />
      <p class="entry-meta">may-2026 / june-2026</p>
      <h2 class="entry-title">entry #9: <em>general</em></h2>

      <div class="entry-section">
        <div class="entry-section-head">june-2026</div>
        <p>wip</p>
        <img
          src="../img/blog/b2/blog2_oct.png"
          alt="glhf grow desktop"
          style="width: 50%; height: auto; display: block; margin: 0 auto"
        />
      </div>

      <div class="entry-section">
        <div class="entry-section-head">may-2026</div>
        <p>wip</p>
        <img src="../img/blog/b2/blog2_sept.PNG" alt="development screenshot" />
      </div>
    </div>

    <script src="../site.js"></script>
  </body>
</html>
