# Build config for kwakd.netlify.app.
#
# No `base`: the dashboard already publishes PW_v3 from the repo root, so
# these paths are root-relative and match it rather than layering a second
# indirection on top. The other PW_v* folders are old versions of the site
# and are not published.
#
# `functions` must point at a directory whose every top-level .js file is a
# real function -- Netlify derives the function name from the filename and
# rejects anything with a dot in it. The tests live in /tests at the repo
# root, which keeps them out of the handlers directory AND out of the
# publish directory, where they were being served to the public.
[build]
  publish = "PW_v3"
  functions = "PW_v3/netlify/functions"

# Planning notes live at the repo root now, outside the publish directory,
# so nothing under /docs is deployed. Kept as a forced rule in case one ever
# lands there again -- without force = true a redirect loses to a real file,
# which is exactly how the notes stayed readable after the first attempt.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# HTML must not be cached hard, or updates never reach returning visitors.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
