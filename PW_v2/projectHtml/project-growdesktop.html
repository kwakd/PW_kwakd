<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK-Portfolio2025-P</title>
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/styles.css" />

    <!-- <link rel="stylesheet" href="styles.css" /> -->
  </head>
  <body>
    <div class="page-container">
      <header>
        <div class="logo">
          <img id="clickable-image" src="/img/testCharA.png" alt="Click me" />
        </div>

        <nav class="top-nav">
          <a href="/index.html">playground + about me</a>
          <a href="/blog.html">blog</a>
          <a href="/project.html">projects</a>
          <button id="toggle-theme">Toggle Dark Mode</button>
        </nav>
      </header>

      <main>
        <div class="blogPostTemplate">
          <div class="image-box">
            <img src="/img/project/proj_growdesk.PNG" alt="Example image" />
          </div>
          <div class="below-image">
            <p>July 2025 ~ February 2026</p>
            <h3>glhf - grow [desktop edition]</h3>
          </div>
          <p>description is a wip but this is a journaling app</p>
          <a
            href="https://tototonme.itch.io/glhf-grow-journal"
            style="text-decoration: underline"
            >itch.io</a
          >
        </div>
      </main>

      <script>
        // 🌙 Theme toggle with localStorage
        const toggleButton = document.getElementById("toggle-theme");
        const prefersDark = localStorage.getItem("theme") === "dark";

        // Apply saved theme on page load
        if (prefersDark) {
          document.body.classList.add("dark-mode");
          toggleButton.textContent = "Switch to Light Mode";
        } else {
          toggleButton.textContent = "Switch to Dark Mode";
        }

        toggleButton.addEventListener("click", () => {
          const isDark = document.body.classList.toggle("dark-mode");
          localStorage.setItem("theme", isDark ? "dark" : "light");
          toggleButton.textContent = isDark
            ? "Switch to Light Mode"
            : "Switch to Dark Mode";
        });
      </script>
      <script>
        const img = document.getElementById("clickable-image");
        let clickCount = 0;
        let imageIndex = 0;

        const newImages = [
          "/img/testCharA_blanka.png",
          "/img/testCharA_bow.png",
          "/img/testCharA_hello.png",
        ];

        img.addEventListener("click", () => {
          clickCount++;

          if (clickCount % 5 === 0) {
            const randomIndex = Math.floor(Math.random() * newImages.length);
            img.src = newImages[randomIndex];
          }
        });
      </script>
    </div>
  </body>
</html>
